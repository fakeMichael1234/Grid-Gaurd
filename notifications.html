<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Notifications - Grid Guard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Real-Time Civic Notifications & Outage Feed</h1>
        <p class="page-desc">Official alerts, dispatch notifications, and outage resolution updates.</p>
      </div>
      <button id="btn-mark-all-read" class="btn btn-secondary btn-sm">
        <i data-lucide="check-check"></i> Mark All as Read
      </button>
    </div>

    <div id="notifications-container" class="notification-list">
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    if (GridApp.requireCitizen()) {
    renderAppHeader('notifications');
    renderAppFooter();

    function renderNotifications() {
      const notifications = GridApp.get('notifications', []);
      const container = document.getElementById('notifications-container');

      if (notifications.length === 0) {
        container.innerHTML = `<div class="card"><p style="color: var(--text-muted);">No notification history recorded.</p></div>`;
        return;
      }

      container.innerHTML = notifications.map(n => `
        <div class="notification-item ${n.unread ? 'unread' : ''} ${n.urgent ? 'urgent' : ''}">
          <div>
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
              <i data-lucide="${n.urgent ? 'alert-triangle' : 'bell'}" style="width: 18px; height: 18px; color: ${n.urgent ? 'var(--emergency-red)' : 'var(--accent-blue)'};"></i>
              <strong style="font-size: 0.95rem;">${n.title}</strong>
              ${n.unread ? '<span style="background: var(--accent-blue); color: white; font-size: 0.65rem; font-weight: 700; padding: 2px 6px; border-radius: 4px;">NEW</span>' : ''}
            </div>
            <p style="font-size: 0.875rem; color: var(--text-main); margin-bottom: 0.25rem;">${n.message}</p>
            <span style="font-size: 0.75rem; color: var(--text-muted);">${n.time}</span>
          </div>
        </div>
      `).join('');

      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('btn-mark-all-read').addEventListener('click', () => {
      const notifications = GridApp.get('notifications', []);
      notifications.forEach(n => n.unread = false);
      GridApp.set('notifications', notifications);
      renderNotifications();
      // Re-render header to clear badge count
      document.querySelector('.top-nav').remove();
      renderAppHeader('notifications');
    });

    document.addEventListener('DOMContentLoaded', renderNotifications);
    }
  </script>
</body>
</html>
