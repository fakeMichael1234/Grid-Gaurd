<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complaint History - Grid Guard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Complaint History</h1>
        <p class="page-desc">Complete archive of citizen-submitted utility defects and status tracking records.</p>
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <label for="history-filter" style="font-size: 0.85rem; font-weight: 600;">Filter Status:</label>
        <select id="history-filter" style="padding: 0.4rem; border-radius: 4px; border: 1px solid var(--border-color);">
          <option value="ALL">All Incidents</option>
          <option value="Reported">Reported</option>
          <option value="Under Review">Under Review</option>
          <option value="Dispatched">Dispatched</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>
    </div>

    <div id="history-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.25rem;">
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    if (GridApp.requireCitizen()) {
    renderAppHeader('history');
    renderAppFooter();

    function renderHistoryCards() {
      const reports = GridApp.get('reports', []);
      const filter = document.getElementById('history-filter').value;
      const filtered = filter === 'ALL' ? reports : reports.filter(r => r.status === filter);
      const grid = document.getElementById('history-grid');

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="card" style="grid-column: 1 / -1;"><p style="color: var(--text-muted);">No incident records match the selected filter.</p></div>`;
        return;
      }

      grid.innerHTML = filtered.map(r => `
        <div class="card" style="display: flex; flex-direction: column; justify-content: space-between; margin: 0;">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
              <span style="font-family: monospace; font-weight: 700; color: var(--text-muted); font-size: 0.85rem;">${r.id}</span>
              <span class="badge ${getBadgeClass(r.status)}">${r.status}</span>
            </div>
            <h3 style="font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem;">${r.title}</h3>
            <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${r.description}</p>
          </div>
          <div>
            <div style="font-size: 0.8rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 0.75rem; margin-bottom: 0.75rem;">
              <div><strong>Category:</strong> ${r.type}</div>
              <div><strong>Location:</strong> ${r.location}</div>
              <div><strong>Date Logged:</strong> ${r.date}</div>
            </div>
            <a href="status-tracking.html?id=${r.id}" class="btn btn-secondary btn-block btn-sm">
              View Audit & Tracking
            </a>
          </div>
        </div>
      `).join('');

      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('history-filter').addEventListener('change', renderHistoryCards);
    document.addEventListener('DOMContentLoaded', renderHistoryCards);
    }
  </script>
</body>
</html>
