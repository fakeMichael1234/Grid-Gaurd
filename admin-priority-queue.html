<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priority Dispatch Queue - Grid Guard Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-shell">
  <main class="main-content" style="max-width: 1300px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; border-bottom: 1px solid #1e293b; padding-bottom: 1rem;">
      <div>
        <h1 class="page-title" style="color: #f8fafc;">Operational Dispatch Priority Queue</h1>
        <p style="color: #94a3b8; font-size: 0.875rem;">Unified queue merging live citizen complaints and hardware pole anomalies into actionable dispatch units.</p>
      </div>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <label style="font-size: 0.85rem; color: #94a3b8; font-weight: 600;">Filter Priority:</label>
        <select id="queue-filter" style="background: #1e293b; border-color: #334155; color: white; padding: 0.4rem; border-radius: 4px;">
          <option value="ALL">All Priorities</option>
          <option value="Emergency">Emergency / Critical</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
      </div>
    </div>

    <!-- Ranked Dispatch Queue Cards -->
    <div id="queue-container" style="display: flex; flex-direction: column; gap: 1rem;">
      <!-- Injected via JS -->
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    if (GridApp.requireAdmin()) {
    renderAppHeader('queue');
    renderAppFooter();

    function renderQueue() {
      const reports = GridApp.get('reports', []);
      const filter = document.getElementById('queue-filter').value;
      const filtered = filter === 'ALL' ? reports : reports.filter(r => r.severity === filter || (filter === 'Emergency' && r.severity === 'Critical'));
      const container = document.getElementById('queue-container');

      if (filtered.length === 0) {
        container.innerHTML = `<div class="admin-card"><p style="color: #64748b;">No live reports match the selected priority filter.</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(r => `
        <div class="admin-card" style="border-left: 4px solid ${r.severity === 'Emergency' || r.severity === 'High' ? '#dc2626' : r.severity === 'Medium' ? '#d97706' : '#3b82f6'};">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
            <div>
              <span style="font-family: monospace; font-size: 0.8rem; color: #38bdf8; font-weight: 700;">TICKET: ${r.id}</span>
              <h3 style="font-size: 1.1rem; color: #f8fafc; font-weight: 700; margin-top: 0.2rem;">${r.title}</h3>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <span class="badge ${getPriorityClass(r.severity)}">${r.severity} PRIORITY</span>
              <span class="badge ${getBadgeClass(r.status)}">${r.status}</span>
            </div>
          </div>

          <div class="grid-2" style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 1rem;">
            <div>
              <p><strong>Location:</strong> ${r.location}</p>
              <p style="margin-top: 0.25rem;"><strong>Category:</strong> ${r.type}</p>
              <p style="margin-top: 0.25rem;"><strong>Incident Description:</strong> ${r.description}</p>
            </div>
            <div>
              <p><strong>Citizen Phone:</strong> ${r.contactPhone || 'N/A'}</p>
              <p style="margin-top: 0.25rem;"><strong>Logged Date:</strong> ${r.date}</p>
              <p style="margin-top: 0.25rem;"><strong>Correlated Pole:</strong> <span style="font-family: monospace; color: #fde047;">POLE-W4-012 (Elm Street Feeder)</span></p>
            </div>
          </div>

          <!-- Ops Dispatcher Status Controller Bar -->
          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #1e293b; padding-top: 0.75rem;">
            <span style="font-size: 0.8rem; color: #94a3b8;"><i data-lucide="shield-alert"></i> Admin State Sync Active</span>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-secondary btn-sm" onclick="changeStatus('${r.id}', 'Under Review')" style="background: #1e293b; color: #fde047; border-color: #334155;">Mark Under Review</button>
              <button class="btn btn-secondary btn-sm" onclick="changeStatus('${r.id}', 'Dispatched')" style="background: #1e3a8a; color: white; border: none;">Dispatch Maintenance Unit</button>
              <button class="btn btn-secondary btn-sm" onclick="changeStatus('${r.id}', 'Resolved')" style="background: #064e3b; color: #6ee7b7; border: none;">Mark Resolved</button>
            </div>
          </div>
        </div>
      `).join('');

      if (window.lucide) lucide.createIcons();
    }

    window.changeStatus = function(ticketId, newStatus) {
      GridApp.updateIncidentStatus(ticketId, newStatus, `Operations Dispatcher updated ticket status to ${newStatus}.`);
      renderQueue();
    };

    document.getElementById('queue-filter').addEventListener('change', renderQueue);
    document.addEventListener('DOMContentLoaded', renderQueue);
    }
  </script>
</body>
</html>
