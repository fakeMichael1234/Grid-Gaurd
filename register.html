<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Citizen Registration - Grid Guard Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-shell" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0b1727;">
  <div class="auth-container" style="max-width: 480px; background: #0f172a; border: 1px solid #1e293b; color: white; padding: 2.5rem; border-radius: 8px;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <img src="logo_v2.png" style="height: 48px; width: 48px; border-radius: 50%; border: 2px solid #2563eb; margin-bottom: 0.5rem;" />
      <h2 style="font-size: 1.25rem; color: #f8fafc;">Create Citizen Account</h2>
      <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem;">Verify municipal residency to log infrastructure defects and receive emergency dispatches.</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label for="reg-name" style="color: #cbd5e1;">Full Legal Name *</label>
        <input type="text" id="reg-name" required placeholder="Jane Doe" style="background: #1e293b; border-color: #334155; color: white;" />
      </div>

      <div class="form-group">
        <label for="reg-email" style="color: #cbd5e1;">Email Address *</label>
        <input type="email" id="reg-email" required placeholder="jane.doe@example.com" style="background: #1e293b; border-color: #334155; color: white;" />
      </div>

      <div class="form-group">
        <label for="reg-phone" style="color: #cbd5e1;">Phone Number (for SMS Outage Alerts) *</label>
        <input type="tel" id="reg-phone" required placeholder="+1 (555) 019-2831" style="background: #1e293b; border-color: #334155; color: white;" />
      </div>

      <div class="form-group">
        <label for="reg-ward" style="color: #cbd5e1;">Municipal Ward / Neighborhood *</label>
        <select id="reg-ward" required style="background: #1e293b; border-color: #334155; color: white;">
          <option value="">Select Ward...</option>
          <option value="Ward 1 - Central Business">Ward 1 - Central Business</option>
          <option value="Ward 2 - East Industrial">Ward 2 - East Industrial Park</option>
          <option value="Ward 3 - West Heights">Ward 3 - West Heights</option>
          <option value="Ward 4 - Elm Residential">Ward 4 - Elm Residential</option>
        </select>
      </div>

      <div class="form-group">
        <label for="reg-password" style="color: #cbd5e1;">Create Password *</label>
        <input type="password" id="reg-password" required placeholder="Minimum 8 characters" style="background: #1e293b; border-color: #334155; color: white;" />
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="background: #2563eb; border: none; margin-top: 1rem;">
        <i data-lucide="check-circle"></i> Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: #94a3b8;">
      Already registered? <a href="login.html" style="color: #38bdf8; font-weight: 600; text-decoration: none;">Sign In</a>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const id = `CIT-${Math.floor(10000 + Math.random() * 90000)}`;

      GridApp.set('session', {
        role: 'citizen',
        name,
        email,
        id
      });

      window.location.href = 'index.html';
    });

    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
