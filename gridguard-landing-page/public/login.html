<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Gateway — GRIDGUARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background: #030712;
      overflow-x: hidden;
    }

    /* Ambient glow */
    body::after {
      background:
        radial-gradient(ellipse 60% 50% at 30% 20%, rgba(56,189,248,0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 70% 80%, rgba(99,102,241,0.05) 0%, transparent 70%);
    }

    .login-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* Header badge */
    .gateway-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      padding: 0.5rem 1.25rem;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 1.5rem;
      animation: fadeSlideUp 0.5s ease-out;
    }

    .gateway-badge img {
      height: 28px;
      width: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(56,189,248,0.4);
    }

    .gateway-badge span {
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .gateway-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.4rem;
      color: #f8fafc;
      animation: fadeSlideUp 0.6s ease-out;
    }

    .gateway-subtitle {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 400;
      margin-bottom: 2.5rem;
      animation: fadeSlideUp 0.7s ease-out;
    }

    /* Card Grid */
    .login-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      width: 100%;
      max-width: 780px;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .login-grid { grid-template-columns: 1fr; max-width: 400px; }
      .gateway-title { font-size: 1.5rem; }
    }

    /* Login Cards */
    .login-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      animation: fadeSlideUp 0.7s ease-out;
    }

    .login-card:hover {
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-3px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .login-card.admin-variant {
      border-color: rgba(239,68,68,0.08);
    }
    .login-card.admin-variant:hover {
      border-color: rgba(239,68,68,0.2);
    }

    /* Card Header */
    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .card-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-icon.citizen {
      background: linear-gradient(135deg, rgba(56,189,248,0.2), rgba(14,165,233,0.1));
      border: 1px solid rgba(56,189,248,0.3);
      color: #38bdf8;
    }

    .card-icon.admin {
      background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(185,28,28,0.1));
      border: 1px solid rgba(248,113,113,0.3);
      color: #f87171;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .card-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 0.15rem;
    }
    .card-label.citizen { color: #38bdf8; }
    .card-label.admin { color: #f87171; }

    /* Form Inputs */
    .login-label {
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 600;
      display: block;
      margin-bottom: 0.35rem;
    }

    .login-input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: rgba(3,7,18,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .login-input:focus {
      outline: none;
      border-color: rgba(56,189,248,0.5);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.1);
      background: rgba(3,7,18,0.95);
    }

    /* ═══════════════════════════════════════
       GLASS MODULE BUTTON — PURE CSS REPLICA
       Mimics the LiquidMetalButton aesthetic
       ═══════════════════════════════════════ */
    .glass-btn {
      width: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1.5rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      border: none;
      border-radius: 50px;
      color: #b0b0b0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);

      /* Outer metallic ring - the key visual */
      background:
        linear-gradient(180deg,
          rgba(80,80,80,0.5) 0%,
          rgba(40,40,40,0.7) 40%,
          rgba(20,20,20,0.9) 100%
        );
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 1px 0 0 rgba(255,255,255,0.1) inset,
        0 -1px 0 0 rgba(0,0,0,0.4) inset,
        0 8px 24px rgba(0,0,0,0.5),
        0 2px 6px rgba(0,0,0,0.3);
    }

    /* Inner dark surface overlay */
    .glass-btn::before {
      content: '';
      position: absolute;
      inset: 2.5px;
      border-radius: 50px;
      background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
      z-index: 0;
      transition: background 0.3s ease;
    }

    /* Shimmer sweep on hover */
    .glass-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
      z-index: 1;
      transition: left 0.6s ease;
    }

    .glass-btn:hover::after {
      left: 100%;
    }

    .glass-btn > * {
      position: relative;
      z-index: 2;
    }

    .glass-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.12),
        0 1px 0 0 rgba(255,255,255,0.15) inset,
        0 -1px 0 0 rgba(0,0,0,0.5) inset,
        0 16px 40px rgba(0,0,0,0.5),
        0 4px 12px rgba(0,0,0,0.3);
      color: #d0d0d0;
    }

    .glass-btn:active {
      transform: translateY(0px) scale(0.98);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 2px 8px rgba(0,0,0,0.4) inset;
    }

    .glass-btn:active::before {
      background: linear-gradient(180deg, #111 0%, #000 100%);
    }

    /* Cyan variant glow */
    .glass-btn.cyan-glow {
      box-shadow:
        0 0 0 1px rgba(56,189,248,0.15),
        0 1px 0 0 rgba(56,189,248,0.15) inset,
        0 -1px 0 0 rgba(0,0,0,0.4) inset,
        0 8px 24px rgba(0,0,0,0.5),
        0 0 20px rgba(56,189,248,0.08);
    }

    .glass-btn.cyan-glow:hover {
      box-shadow:
        0 0 0 1px rgba(56,189,248,0.3),
        0 1px 0 0 rgba(56,189,248,0.2) inset,
        0 -1px 0 0 rgba(0,0,0,0.5) inset,
        0 16px 40px rgba(0,0,0,0.5),
        0 0 30px rgba(56,189,248,0.15);
      color: #7dd3fc;
    }

    /* Red variant glow */
    .glass-btn.red-glow {
      box-shadow:
        0 0 0 1px rgba(239,68,68,0.15),
        0 1px 0 0 rgba(239,68,68,0.12) inset,
        0 -1px 0 0 rgba(0,0,0,0.4) inset,
        0 8px 24px rgba(0,0,0,0.5),
        0 0 20px rgba(239,68,68,0.08);
    }

    .glass-btn.red-glow:hover {
      box-shadow:
        0 0 0 1px rgba(239,68,68,0.3),
        0 1px 0 0 rgba(239,68,68,0.2) inset,
        0 -1px 0 0 rgba(0,0,0,0.5) inset,
        0 16px 40px rgba(0,0,0,0.5),
        0 0 30px rgba(239,68,68,0.15);
      color: #fca5a5;
    }

    /* Card footer */
    .card-footer {
      text-align: center;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255,255,255,0.04);
      font-size: 0.8rem;
      color: #475569;
    }

    .card-footer a {
      color: #38bdf8;
      font-weight: 600;
      text-decoration: none;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }

    /* Status bar */
    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      background: rgba(3,7,18,0.9);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 0.65rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: #334155;
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      margin-right: 0.5rem;
      box-shadow: 0 0 8px rgba(52,211,153,0.4);
      animation: pulseGlow 2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div style="text-align: center; position: relative; z-index: 1;">
      <div class="gateway-badge">
        <img src="logo_v2.png" alt="GridGuard" />
        <span>GridGuard Gateway</span>
      </div>
      <h1 class="gateway-title">Select Your Portal</h1>
      <p class="gateway-subtitle">Choose authorization level to access the platform.</p>
    </div>

    <div class="login-grid">
      <!-- Citizen Portal -->
      <div class="login-card">
        <div class="card-header">
          <div class="card-icon citizen">
            <i data-lucide="user" style="width: 18px; height: 18px;"></i>
          </div>
          <div>
            <div class="card-title">Citizen Login</div>
            <div class="card-label citizen">Infrastructure Portal</div>
          </div>
        </div>

        <form id="form-login-citizen">
          <div style="margin-bottom: 0.85rem;">
            <label class="login-label">Citizen Email / Account ID</label>
            <input type="email" id="citizen-email" required value="ram.kumar@chennai.gov.in" class="login-input" />
          </div>
          <div style="margin-bottom: 1.25rem;">
            <label class="login-label">Password</label>
            <input type="password" id="citizen-pass" required value="password123" class="login-input" />
          </div>
          <button type="submit" class="glass-btn cyan-glow">
            <i data-lucide="log-in" style="width: 16px; height: 16px;"></i>
            <span>Citizen Login</span>
          </button>
        </form>

        <div class="card-footer">
          New user? <a href="register.html">Register Account</a>
        </div>
      </div>

      <!-- Admin Portal -->
      <div class="login-card admin-variant">
        <div class="card-header">
          <div class="card-icon admin">
            <i data-lucide="shield-check" style="width: 18px; height: 18px;"></i>
          </div>
          <div>
            <div class="card-title">Officers Login</div>
            <div class="card-label admin">Operations Center & Telemetry</div>
          </div>
        </div>

        <form id="form-login-admin">
          <div style="margin-bottom: 0.85rem;">
            <label class="login-label">Ops Dispatcher Username</label>
            <input type="text" id="admin-user" required value="ops_dispatcher_01" class="login-input" />
          </div>
          <div style="margin-bottom: 1.25rem;">
            <label class="login-label">Security Key</label>
            <input type="password" id="admin-pass" required value="adminpass2026" class="login-input" />
          </div>
          <button type="submit" class="glass-btn red-glow">
            <i data-lucide="lock" style="width: 16px; height: 16px;"></i>
            <span>Officers Login</span>
          </button>
        </form>

        <div class="card-footer" style="color: #334155;">
          <i data-lucide="shield" style="width: 12px; height: 12px; display: inline;"></i>
          Authorized Personnel Only.
        </div>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span><span class="status-dot"></span>GRIDGUARD Core: All Systems Operational</span>
    <span style="font-family: 'JetBrains Mono', monospace;">v4.2.0 · TLS 1.3 Encrypted</span>
  </div>

  <script src="common.js"></script>
  <script>
    document.getElementById('form-login-citizen').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('citizen-email').value;
      GridApp.set('session', {
        role: 'citizen',
        email,
        name: email.split('@')[0].replace('.', ' ').replace(/\b\w/g, c => c.toUpperCase()),
        id: 'CIT-88492'
      });
      window.location.href = 'portal-dashboard.html';
    });

    document.getElementById('form-login-admin').addEventListener('submit', (e) => {
      e.preventDefault();
      const u = document.getElementById('admin-user').value;
      GridApp.set('session', {
        role: 'admin',
        email: 'ops@gridguard.gov',
        name: u,
        id: 'OPS-DISPATCH-01'
      });
      window.location.href = 'admin-faults.html';
    });

    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
