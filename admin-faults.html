<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complaints Ledger - Grid Guard Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-shell">
  <main class="main-content" style="max-width: 1350px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; border-bottom: 1px solid #1e293b; padding-bottom: 1rem;">
      <div>
        <h1 class="page-title" style="color: #f8fafc;">Complaints Ledger</h1>
        <p style="color: #94a3b8; font-size: 0.875rem;">Live feed of real citizen-submitted defect reports and emergency fast-path requests.</p>
      </div>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <label for="status-filter" style="font-size: 0.85rem; color: #94a3b8; font-weight: 600;">Filter Status:</label>
        <select id="status-filter" style="background: #1e293b; border-color: #334155; color: white; padding: 0.4rem 0.75rem; border-radius: 4px; font-size: 0.85rem;">
          <option value="ALL">All Complaints</option>
          <option value="Reported">Reported</option>
          <option value="Under Review">Under Review</option>
          <option value="Dispatched">Dispatched</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>
    </div>

    <!-- Active Complaints Table -->
    <div class="admin-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h3 style="font-size: 0.95rem; font-weight: 600; color: #cbd5e1; text-transform: uppercase; letter-spacing: 0.04em;">
          Citizen Report Stream (<span id="complaints-count">0</span> Reports Active)
        </h3>
        <span style="font-size: 0.75rem; color: #38bdf8; font-family: monospace;">Citizen Sync: Direct Database Connection</span>
      </div>

      <div style="overflow-x: auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Ticket ID</th>
              <th>Citizen Name</th>
              <th>Complaint Type</th>
              <th>Description</th>
              <th>Location</th>
              <th>Photo / Video Evidence</th>
              <th>Submitted Time</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="complaints-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    if (GridApp.requireAdmin()) {
    renderAppHeader('complaints');
    renderAppFooter();

    function renderUserComplaints() {
      const reports = GridApp.get('reports', []);
      const filter = document.getElementById('status-filter').value;
      const filtered = filter === 'ALL' ? reports : reports.filter(r => r.status === filter);
      const tbody = document.getElementById('complaints-tbody');
      document.getElementById('complaints-count').textContent = filtered.length;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" style="text-align: center; color: #64748b; padding: 2rem;">
              No citizen complaints match the selected filter.
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(r => {
        const mediaCount = r.attachments ? r.attachments.length : 0;
        const mediaLabel = mediaCount > 0 
          ? `<span class="badge" style="background: #1e293b; color: #38bdf8; border: 1px solid #334155;"><i data-lucide="camera" style="width: 12px; height: 12px; margin-right: 4px;"></i> ${mediaCount} File${mediaCount > 1 ? 's' : ''} Attached</span>`
          : `<span style="color: #64748b; font-size: 0.8rem;">No Attachment</span>`;

        return `
          <tr>
            <td><strong style="font-family: monospace; color: #38bdf8;">${r.id}</strong></td>
            <td>
              <div style="font-weight: 600; color: #f8fafc;">${r.citizenName || 'Registered Citizen'}</div>
              <span style="font-size: 0.725rem; color: #94a3b8;">${r.contactPhone || 'Contact File On Record'}</span>
            </td>
            <td><strong style="color: #f1f5f9;">${r.type}</strong></td>
            <td>
              <div style="max-width: 320px; line-height: 1.35;">
                <span style="font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 2px;">${r.title}</span>
                <span style="font-size: 0.8rem; color: #94a3b8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${r.description}</span>
              </div>
            </td>
            <td style="font-size: 0.825rem; color: #e2e8f0;">${r.location}</td>
            <td>${mediaLabel}</td>
            <td style="color: #94a3b8; font-size: 0.75rem; white-space: nowrap;">${r.date}</td>
            <td><span class="badge ${getBadgeClass(r.status)}">${r.status}</span></td>
            <td>
              <div style="display: flex; gap: 0.35rem;">
                ${r.status !== 'Resolved' ? `
                  <button class="btn btn-secondary btn-sm" style="background: #1e293b; color: #38bdf8; border-color: #334155; padding: 2px 8px;" onclick="updateComplaintStatus('${r.id}', 'Dispatched')">Dispatch Unit</button>
                  <button class="btn btn-secondary btn-sm" style="background: #064e3b; color: #6ee7b7; border: none; padding: 2px 8px;" onclick="updateComplaintStatus('${r.id}', 'Resolved')">Resolve</button>
                ` : `
                  <span style="font-size: 0.75rem; color: #64748b;">Closed</span>
                `}
              </div>
            </td>
          </tr>
        `;
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    window.updateComplaintStatus = function(ticketId, newStatus) {
      GridApp.updateIncidentStatus(ticketId, newStatus, `Dispatcher set status to ${newStatus} via Complaints Ledger.`);
      renderUserComplaints();
    };

    document.getElementById('status-filter').addEventListener('change', renderUserComplaints);
    document.addEventListener('DOMContentLoaded', renderUserComplaints);
    }
  </script>
</body>
</html>
